<!doctype html><meta charset="utf-8"><body><pre id="out"></pre><script>
const W=3840,H=2160;
const C={paper:'#EFE9DC',edge:'#D9D0BD',card:'#F8F4EA',ink:'#2B2622',soft:'#6D645A',accent:'#E2611F',white:'#FFFFFF'};
const L=[];
function layer(group,name,draw,o={}){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.lineCap='round';x.lineJoin='round';draw(x);L.push({group,name,visible:o.visible!==false,blend:o.blend||'NORMAL',opacity:o.opacity??100,png:c.toDataURL('image/png')});}
function stroke(x,d,tx,ty,s,color,w,rot=0,cx=0,cy=0){x.save();x.translate(tx,ty);if(rot){x.translate(cx,cy);x.rotate(rot*Math.PI/180);x.translate(-cx,-cy)}x.scale(s,s);x.strokeStyle=color;x.lineWidth=w/s;x.stroke(new Path2D(d));x.restore();}
function fillPath(x,d,tx,ty,s,color){x.save();x.translate(tx,ty);x.scale(s,s);x.fillStyle=color;x.fill(new Path2D(d));x.restore();}
function rrect(x,X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);}
function grain(x,X,Y,w,h,alpha){const img=x.getImageData(X,Y,w,h),d=img.data;let s=1234567;for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;s=(s*16807)%2147483647;const n=(s/2147483647-.5)*alpha;d[i]=Math.max(0,Math.min(255,d[i]+n));d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));}x.putImageData(img,X,Y);}
function shadow(x,X,Y,w,h,r,blur,dy,a){x.save();x.filter=`blur(${blur}px)`;x.fillStyle=`rgba(43,38,34,${a})`;rrect(x,X,Y+dy,w,h,r);x.fill();x.restore();}

// ---------- Panel_Station (composed on the right) ----------
const P={x:2680,y:300,w:1040,h:1480};
layer('Panel_Station','Shadow',x=>shadow(x,P.x+10,P.y,P.w-20,P.h,6,36,36,.45));
layer('Panel_Station','BG_Paper',x=>{x.fillStyle=C.paper;rrect(x,P.x,P.y,P.w,P.h,6);x.fill();x.fillStyle=C.edge;x.fillRect(P.x+6,P.y+P.h-3,P.w-12,3);grain(x,P.x,P.y,P.w,P.h,22);});
const LOGO='M4 26C10 8 22 6 20 14S8 28 14 28s16-22 20-16-6 14 0 12 8-8 8-8';
layer('Panel_Station/Header','Logo_Stroke',x=>stroke(x,LOGO,P.x+60,P.y+60,2,C.accent,5));
layer('Panel_Station/Header','Divider',x=>{x.fillStyle=C.edge;x.fillRect(P.x+60,P.y+180,P.w-120,2);});
const X_D='M4 4l14 14M18 4 4 18';
layer('Panel_Station/Btn_Close','Btn_Close_Normal',x=>stroke(x,X_D,P.x+P.w-100,P.y+40,60/22,C.ink,4.5));
layer('Panel_Station/Btn_Close','Btn_Close_Hover',x=>stroke(x,X_D,P.x+P.w-100,P.y+40,60/22,C.accent,4.5),{visible:false});
const LY=P.y+1060;
layer('Panel_Station/Link','Arrow_Stroke',x=>stroke(x,'M1 6h19M15 1l5 5-5 5',P.x+60,LY,2,C.accent,4.5));
layer('Panel_Station/Link','Underline_Stroke',x=>stroke(x,'M0 4C60 1 120 6 180 3s90 2 120 0',P.x+124,LY+30,2,C.accent,4.5));
const SIGN='M6 40c10-24 22-30 18-16S8 44 18 42s10-14 14-14-4 12 2 12 6-10 10-10-2 10 4 10 8-14 14-14-6 12 2 12 10-6 14-10 6 0 22-8';
layer('Panel_Station/Footer','Signature_Stroke',x=>stroke(x,SIGN,P.x+60,P.y+1240,2,C.ink,3.8));

// ---------- Ticket (placed in the panel, slot 1) ----------
const T={x:P.x+60,y:P.y+560,w:300,h:340,art:168,stub:76,notch:14};
const notchY=T.y+T.h-T.stub;
function ticketShape(x){rrect(x,T.x,T.y,T.w,T.h,6);}
layer('Ticket','Shadow',x=>{shadow(x,T.x+6,T.y,T.w-12,T.h,6,14,14,.4);});
layer('Ticket','BG_Card',x=>{x.fillStyle=C.card;ticketShape(x);x.fill();grain(x,T.x,T.y,T.w,T.h,12);x.globalCompositeOperation='destination-out';x.beginPath();x.arc(T.x,notchY,T.notch,0,7);x.arc(T.x+T.w,notchY,T.notch,0,7);x.fill();});
layer('Ticket','Art_Area',x=>{x.save();ticketShape(x);x.clip();x.fillStyle=C.white;x.fillRect(T.x,T.y,T.w,T.art);x.restore();x.fillStyle=C.edge;x.fillRect(T.x,T.y+T.art,T.w,2);});
layer('Ticket','Perforation',x=>{x.strokeStyle=C.edge;x.lineWidth=4;x.lineCap='butt';x.setLineDash([12,9]);x.beginPath();x.moveTo(T.x+T.notch+6,notchY);x.lineTo(T.x+T.w-T.notch-6,notchY);x.stroke();});
function playBtn(x,filled){const bx=T.x+T.w-150,by=notchY+16,bw=126,bh=46;x.save();x.translate(bx+bw/2,by+bh/2);x.rotate(-4*Math.PI/180);x.translate(-bw/2,-bh/2);x.lineWidth=3;x.strokeStyle=C.accent;rrect(x,0,0,bw,bh,4);if(filled){x.fillStyle=C.accent;x.fill();}x.stroke();x.fillStyle=filled?C.card:C.accent;x.beginPath();x.moveTo(18,13);x.lineTo(18,33);x.lineTo(36,23);x.closePath();x.fill();
  // "PLAY" as strokes so the PSD has no live text
  x.strokeStyle=filled?C.card:C.accent;x.lineWidth=3.2;const g=new Path2D('M50 34V12h8a5 5 0 0 1 0 10h-8M70 12v22h12M88 34l7-22 7 22M91 26h8M108 12l6 11 6-11M114 23v11');x.stroke(g);x.restore();}
layer('Ticket/Btn_Play','Btn_Play_Normal',x=>playBtn(x,false));
layer('Ticket/Btn_Play','Btn_Play_Pressed',x=>playBtn(x,true),{visible:false});
const ARTS=[['Art_ShellBound_Stroke','M33 30c0-4 4-6 7-3s1 9-5 9-11-6-9-13 10-11 17-8 11 12 6 19-17 10-25 3'],
 ['Art_Maskadu_Stroke','M10 14c8-4 38-4 46 0 2 14-6 30-23 30S8 28 10 14M20 24c3-3 7-3 9 0M37 24c3-3 7-3 9 0M27 36c4 2 8 2 12 0'],
 ['Art_WhereIsMyMind_Stroke','M20 42c-8 0-12-8-8-14-4-8 4-16 12-14 2-6 14-8 18-2 8-2 14 6 10 12 4 6-2 14-10 14-2 4-8 6-12 2-4 3-8 3-10 2M33 16v26'],
 ['Art_ChatBaker_Stroke','M28 30a12 12 0 1 1 0-1M37 37l14 13M22 26c2-3 6-4 9-2'],
 ['Art_KaasJourney_Stroke','M6 44c8 0 8-12 16-12s8 12 16 12 8-12 16-12c4 0 6-4 4-8s-8-2-8 2M54 22l3-1'],
 ['Art_Project_Stroke','M12 40 33 12l21 28zM33 12v28M12 40h42M24 28h18']];
ARTS.forEach(([n,d],i)=>layer('Ticket/Art',n,x=>stroke(x,d,T.x+(T.w-132)/2,T.y+(T.art-112)/2,2,C.ink,4.5),{visible:i===0}));

// ---------- Component sheet (left side) ----------
// Stamp
const S={x:200,y:300,w:400,h:100};
function stampFrame(x,filled){x.save();x.translate(S.x+S.w/2,S.y+S.h/2);x.rotate(-2*Math.PI/180);x.translate(-S.w/2,-S.h/2);x.strokeStyle=C.accent;x.lineWidth=5;rrect(x,0,0,S.w,S.h,6);if(filled){x.fillStyle=C.accent;x.fill();}x.stroke();x.lineWidth=2;x.globalAlpha=.6;x.strokeStyle=filled?C.card:C.accent;rrect(x,7,7,S.w-14,S.h-14,3);x.stroke();x.restore();}
layer('Stamp','Stamp_Normal',x=>stampFrame(x,false));
layer('Stamp','Stamp_Inked',x=>stampFrame(x,true),{visible:false});
layer('Stamp','Icon_Download_Stroke',x=>stroke(x,'M8 2v9M4 7l4 4 4-4M3 14h10',S.x+S.w+60,S.y+34,2,C.accent,4));
layer('Stamp','Icon_External_Stroke',x=>stroke(x,'M6 3H3v10h10v-3M9 2h5v5M14 2 7 9',S.x+S.w+140,S.y+34,2,C.accent,4));
// Career
const K={x:200,y:640,w:1300};
layer('Career','Rail',x=>{x.strokeStyle=C.ink;x.lineWidth=6;x.beginPath();x.moveTo(K.x,K.y+150);x.lineTo(K.x+K.w,K.y+150);x.stroke();});
layer('Career','Tick',x=>{x.strokeStyle=C.ink;x.lineWidth=4;x.beginPath();x.moveTo(K.x,K.y+132);x.lineTo(K.x,K.y+168);x.stroke();});
layer('Career','Arc_Stroke',x=>stroke(x,'M0 70C20 30 70 30 90 70',K.x+120,K.y+8,2.4,C.accent,4.5));
const PL={prev:'M4 3h2v14H4zM17 3v14L7 10z',play:'M5 3v14l12-7z',next:'M14 3h2v14h-2zM3 3v14l10-7z'};
Object.entries(PL).forEach(([k,d],i)=>{const nm='Btn_'+k[0].toUpperCase()+k.slice(1);
  layer('Career/Player/'+nm,nm+'_Normal',x=>fillPath(x,d,K.x+K.w/2-130+i*90,K.y+230,2.4,C.ink));
  layer('Career/Player/'+nm,nm+'_Hover',x=>fillPath(x,d,K.x+K.w/2-130+i*90,K.y+230,2.4,C.accent),{visible:false});});
// QuickNav
const Q={x:200,y:1700,n:5,cell:92,pad:12};
layer('HUD/QuickNav','BG',x=>{x.fillStyle=C.paper;rrect(x,Q.x,Q.y,Q.n*Q.cell+2*Q.pad,Q.cell+2*Q.pad,4);x.fill();x.fillStyle=C.edge;x.fillRect(Q.x+4,Q.y+Q.cell+2*Q.pad,Q.n*Q.cell+2*Q.pad-8,4);grain(x,Q.x,Q.y,Q.n*Q.cell+2*Q.pad,Q.cell+2*Q.pad,16);});
const ICONS={About:'M8 26c0-6 4-9 8-9s8 3 8 9M16 15c-3 0-5-2-5-5s2-5 5-5 5 2 5 5-2 5-5 5',Games:'M6 20c0-5 2-8 6-8h8c4 0 6 3 6 8 0 3-2 4-4 2l-3-3h-6l-3 3c-2 2-4 1-4-2M11 15v4M9 17h4',Projects:'M6 26 20 12l4 4L10 30H6zM20 12l3-3 4 4-3 3M5 6h10',Career:'M4 20h24M8 17v6M16 17v6M24 17v6M8 16c2-6 6-6 8 0M16 16c2-6 6-6 8 0',Contact:'M5 9h22v15H5zM5 9l11 9 11-9'};
Object.entries(ICONS).forEach(([k,d],i)=>{const ix=Q.x+Q.pad+i*Q.cell+16,iy=Q.y+Q.pad+16;
  layer('HUD/QuickNav/Icons','Icon_'+k+'_Normal',x=>stroke(x,d,ix,iy,60/32,C.ink,4));
  layer('HUD/QuickNav/Icons','Icon_'+k+'_Active',x=>stroke(x,d,ix,iy,60/32,C.accent,4),{visible:false});});
// FX grain tile
layer('FX','Grain_Tile',x=>{x.fillStyle='#808080';x.fillRect(1700,300,512,512);grain(x,1700,300,512,512,90);},{blend:'MULTIPLY',opacity:35});

document.getElementById('out').textContent=JSON.stringify(L);
</script></body>

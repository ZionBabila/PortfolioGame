<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#73b8e6">
    <title>Portfolio</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="title">Portfolio</div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div class="hint">Loading the map&hellip;</div>
    </div>
    <div id="warning"></div>
    <noscript>This portfolio is an interactive game and needs JavaScript.</noscript>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var w = document.querySelector("#warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.className = type === "error" ? "error" : "warn";
        w.appendChild(div);
        if (type !== "error") setTimeout(function () { w.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Portfolio",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // Phones: cap resolution a bit to keep frame rate smooth.
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#loading").classList.add("done");
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
